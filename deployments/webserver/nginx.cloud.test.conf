# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/agentstudio/webserver.pid;
error_log /var/log/sdkwork/agentstudio/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name agentstudio-test.sdkwork.com agentstudio-test.birdcoder.com agentstudio-test.dtupay.com agentstudio-test.noaper.com agentstudio-test.sdkwork.cn agentstudio-test.birdcoder.cn agentstudio-test.dtupay.cn agentstudio-test.noaper.cn agentstudio-test.skubc.com agentstudio-test.skubc.cn agentstudio-test.zowalk.com agentstudio-test.zowalk.cn agentstudio-test.offer86.com agentstudio-test.offer86.cn agentstudio-test.86offer.com agentstudio-test.86offer.cn agentstudio-app-test.sdkwork.com agentstudio-app-test.birdcoder.com agentstudio-app-test.dtupay.com agentstudio-app-test.noaper.com agentstudio-app-test.sdkwork.cn agentstudio-app-test.birdcoder.cn agentstudio-app-test.dtupay.cn agentstudio-app-test.noaper.cn agentstudio-app-test.skubc.com agentstudio-app-test.skubc.cn agentstudio-app-test.zowalk.com agentstudio-app-test.zowalk.cn agentstudio-app-test.offer86.com agentstudio-app-test.offer86.cn agentstudio-app-test.86offer.com agentstudio-app-test.86offer.cn agentstudio-admin-test.sdkwork.com agentstudio-admin-test.birdcoder.com agentstudio-admin-test.dtupay.com agentstudio-admin-test.noaper.com agentstudio-admin-test.sdkwork.cn agentstudio-admin-test.birdcoder.cn agentstudio-admin-test.dtupay.cn agentstudio-admin-test.noaper.cn agentstudio-admin-test.skubc.com agentstudio-admin-test.skubc.cn agentstudio-admin-test.zowalk.com agentstudio-admin-test.zowalk.cn agentstudio-admin-test.offer86.com agentstudio-admin-test.offer86.cn agentstudio-admin-test.86offer.com agentstudio-admin-test.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/agentstudio/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
