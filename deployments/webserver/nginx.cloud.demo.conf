# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/agentstudio/webserver.pid;
error_log /var/log/sdkwork/agentstudio/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name agentstudio-demo.sdkwork.com agentstudio-demo.birdcoder.com agentstudio-demo.dtupay.com agentstudio-demo.noaper.com agentstudio-demo.sdkwork.cn agentstudio-demo.birdcoder.cn agentstudio-demo.dtupay.cn agentstudio-demo.noaper.cn agentstudio-demo.skubc.com agentstudio-demo.skubc.cn agentstudio-demo.zowalk.com agentstudio-demo.zowalk.cn agentstudio-demo.offer86.com agentstudio-demo.offer86.cn agentstudio-demo.86offer.com agentstudio-demo.86offer.cn agentstudio-app-demo.sdkwork.com agentstudio-app-demo.birdcoder.com agentstudio-app-demo.dtupay.com agentstudio-app-demo.noaper.com agentstudio-app-demo.sdkwork.cn agentstudio-app-demo.birdcoder.cn agentstudio-app-demo.dtupay.cn agentstudio-app-demo.noaper.cn agentstudio-app-demo.skubc.com agentstudio-app-demo.skubc.cn agentstudio-app-demo.zowalk.com agentstudio-app-demo.zowalk.cn agentstudio-app-demo.offer86.com agentstudio-app-demo.offer86.cn agentstudio-app-demo.86offer.com agentstudio-app-demo.86offer.cn agentstudio-admin-demo.sdkwork.com agentstudio-admin-demo.birdcoder.com agentstudio-admin-demo.dtupay.com agentstudio-admin-demo.noaper.com agentstudio-admin-demo.sdkwork.cn agentstudio-admin-demo.birdcoder.cn agentstudio-admin-demo.dtupay.cn agentstudio-admin-demo.noaper.cn agentstudio-admin-demo.skubc.com agentstudio-admin-demo.skubc.cn agentstudio-admin-demo.zowalk.com agentstudio-admin-demo.zowalk.cn agentstudio-admin-demo.offer86.com agentstudio-admin-demo.offer86.cn agentstudio-admin-demo.86offer.com agentstudio-admin-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/agentstudio/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
