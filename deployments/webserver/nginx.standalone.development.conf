# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/agentstudio/webserver.pid;
error_log /var/log/sdkwork/agentstudio/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:18797;
    }
    server {
        listen 80;
        server_name agentstudio-dev.sdkwork.com agentstudio-dev.birdcoder.com agentstudio-dev.dtupay.com agentstudio-dev.noaper.com agentstudio-dev.sdkwork.cn agentstudio-dev.birdcoder.cn agentstudio-dev.dtupay.cn agentstudio-dev.noaper.cn agentstudio-dev.skubc.com agentstudio-dev.skubc.cn agentstudio-dev.zowalk.com agentstudio-dev.zowalk.cn agentstudio-dev.offer86.com agentstudio-dev.offer86.cn agentstudio-dev.86offer.com agentstudio-dev.86offer.cn agentstudio-app-dev.sdkwork.com agentstudio-app-dev.birdcoder.com agentstudio-app-dev.dtupay.com agentstudio-app-dev.noaper.com agentstudio-app-dev.sdkwork.cn agentstudio-app-dev.birdcoder.cn agentstudio-app-dev.dtupay.cn agentstudio-app-dev.noaper.cn agentstudio-app-dev.skubc.com agentstudio-app-dev.skubc.cn agentstudio-app-dev.zowalk.com agentstudio-app-dev.zowalk.cn agentstudio-app-dev.offer86.com agentstudio-app-dev.offer86.cn agentstudio-app-dev.86offer.com agentstudio-app-dev.86offer.cn agentstudio-admin-dev.sdkwork.com agentstudio-admin-dev.birdcoder.com agentstudio-admin-dev.dtupay.com agentstudio-admin-dev.noaper.com agentstudio-admin-dev.sdkwork.cn agentstudio-admin-dev.birdcoder.cn agentstudio-admin-dev.dtupay.cn agentstudio-admin-dev.noaper.cn agentstudio-admin-dev.skubc.com agentstudio-admin-dev.skubc.cn agentstudio-admin-dev.zowalk.com agentstudio-admin-dev.zowalk.cn agentstudio-admin-dev.offer86.com agentstudio-admin-dev.offer86.cn agentstudio-admin-dev.86offer.com agentstudio-admin-dev.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/agentstudio/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
