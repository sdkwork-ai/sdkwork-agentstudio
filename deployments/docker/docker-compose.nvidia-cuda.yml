# Shared log rotation policy (OPERATIONS_SPEC.md §2.3): every service rotates
# at 10MB, keeping 3 files, so container logs cannot fill the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  agentstudio-server:
    env_file:
      - profiles/default.env
      - profiles/nvidia-cuda.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    logging: *default-logging
